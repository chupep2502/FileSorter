name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore FileSorter.csproj
        # Tests project restores transitively via ProjectReference.

      - name: Build (Release)
        run: dotnet build FileSorter.csproj -c Release --no-restore

      - name: Test
        run: dotnet test FileSorter.Tests/FileSorter.Tests.csproj -c Debug --nologo --logger "console;verbosity=normal"
